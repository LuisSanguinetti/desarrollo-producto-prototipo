<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vecino · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  /* Vecino — marketplace de changas de confianza (Uruguay). App mockup, pantalla única con frame de teléfono. */
  :root{
    color-scheme: light;
    --ink:#16201C;            /* texto principal */
    --green:#0E7C66;          /* confianza / acento primario */
    --green-soft:#E3F1ED;
    --amber:#B9820A;          /* dinero / verificado */
    --amber-soft:#FBF0D8;
    --paper:#F6F4EF;          /* fondo app */
    --card:#FFFFFF;
    --line:#E3E0D8;
    --muted:#6B726C;
    --danger:#B4412E;
    --shadow:0 1px 2px rgba(22,32,28,.06), 0 8px 24px rgba(22,32,28,.08);
    --radius:16px;
    --font-body:"Figtree", system-ui, sans-serif;
    --font-display:"Fraunces", Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100%;
    padding:24px 16px;
  }
  #root{width:100%; display:flex; justify-content:center}
  button{font-family:inherit; cursor:pointer}
  @media (prefers-reduced-motion: no-preference){
    .fade{animation:fade .22s ease}
    @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState} = React;

/* ---------- datos de ejemplo ---------- */
const TIPOS = ["Armar muebles","Cargar / mudanza","Colgar / instalar","Limpieza pesada","Jardín","Otro"];

const PRESTADORES = [
  {id:1, nombre:"Mariana P.", avatar:"MP", rating:4.9, resenas:127, verificado:true, desde:"2023",
   titulo:"Armado de muebles y pequeñas instalaciones",
   precio:"$ 1.200 – 1.600", zona:"Pocitos · Buceo", trabajos:214,
   incluye:["Armado de placar / cómoda / cama","Lleva sus herramientas","Retira el embalaje"],
   insignias:["Identidad verificada","Antecedentes al día","Herramienta propia"]},
  {id:2, nombre:"Diego R.", avatar:"DR", rating:4.8, resenas:89, verificado:true, desde:"2024",
   titulo:"Mudanzas, carga y fuerza bruta",
   precio:"$ 1.000 – 1.500", zona:"Centro · Cordón", trabajos:96,
   incluye:["Carga y descarga","Sube por escalera","Viene con un ayudante"],
   insignias:["Identidad verificada","Antecedentes al día"]},
  {id:3, nombre:"Sofía L.", avatar:"SL", rating:5.0, resenas:41, verificado:true, desde:"2025",
   titulo:"Instalaciones, estantes y cuadros",
   precio:"$ 900 – 1.300", zona:"Carrasco · Punta Gorda", trabajos:52,
   incluye:["Colgado de cuadros / estantes","Taladro y tarugos incluidos","Deja todo a nivel"],
   insignias:["Identidad verificada"]},
];

const CHANGAS_PRESTADOR = [
  {id:"a", titulo:"Armar un placar de 3 puertas", zona:"Pocitos · 2,4 km", cuando:"Hoy, a partir de 16:00",
   monto:"$ 1.400", alcance:["Placar ya comprado, en caja","Pieza en planta baja","Incluye retirar embalaje"]},
  {id:"b", titulo:"Bajar una heladera de un 4º piso", zona:"Cordón · 3,1 km", cuando:"Mañana 10:00",
   monto:"$ 1.600", alcance:["Sin ascensor","Se necesita 1 ayudante","Trayecto corto a camioneta"]},
];

/* ---------- UI helpers ---------- */
const Badge = ({children, tone="green"}) => {
  const tones = {
    green:{bg:"var(--green-soft)", fg:"var(--green)"},
    amber:{bg:"var(--amber-soft)", fg:"var(--amber)"},
    gray:{bg:"#EEEDE8", fg:"var(--muted)"},
  }[tone];
  return <span style={{background:tones.bg, color:tones.fg, fontSize:12, fontWeight:600,
    padding:"4px 9px", borderRadius:99, display:"inline-flex", gap:5, alignItems:"center", lineHeight:1.2}}>{children}</span>;
};

const Check = ({c="var(--green)"}) => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style={{flex:"0 0 auto", marginTop:2}}>
    <circle cx="12" cy="12" r="11" fill={c} opacity=".14"/>
    <path d="M7 12.5l3 3 7-7.5" stroke={c} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const Shield = ({s=14, c="var(--green)"}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none">
    <path d="M12 2l8 3v6c0 5-3.4 8.3-8 11-4.6-2.7-8-6-8-11V5l8-3z" fill={c} opacity=".16"/>
    <path d="M12 2l8 3v6c0 5-3.4 8.3-8 11-4.6-2.7-8-6-8-11V5l8-3z" stroke={c} strokeWidth="1.6"/>
    <path d="M8.5 12l2.4 2.4 4.6-5" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const Star = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--amber)"><path d="M12 2l3 6.3 6.9.9-5 4.8 1.2 6.9L12 18.6 5.9 21l1.2-6.9-5-4.8 6.9-.9L12 2z"/></svg>
);

const Btn = ({children, onClick, variant="primary", sub}) => {
  const base={width:"100%", border:"none", borderRadius:12, padding:"14px 16px",
    fontSize:15, fontWeight:700, display:"flex", flexDirection:"column", alignItems:"center", gap:2};
  const styles={
    primary:{...base, background:"var(--green)", color:"#fff"},
    amber:{...base, background:"var(--amber)", color:"#fff"},
    ghost:{...base, background:"transparent", color:"var(--green)", border:"1.5px solid var(--green)"},
  }[variant];
  return <button onClick={onClick} style={styles}>{children}{sub && <span style={{fontSize:11.5, fontWeight:500, opacity:.85}}>{sub}</span>}</button>;
};

const Section = ({children}) => <div className="fade" style={{display:"flex", flexDirection:"column", gap:14}}>{children}</div>;
const H = ({children, sub}) => (
  <div>
    <h2 style={{fontFamily:"var(--font-display)", fontWeight:600, fontSize:21, margin:"0 0 2px", letterSpacing:"-.01em"}}>{children}</h2>
    {sub && <p style={{margin:0, color:"var(--muted)", fontSize:13.5}}>{sub}</p>}
  </div>
);
const Card = ({children, onClick, pad=14}) => (
  <div onClick={onClick} style={{background:"var(--card)", border:"1px solid var(--line)", borderRadius:14,
    padding:pad, boxShadow:"var(--shadow)", cursor:onClick?"pointer":"default"}}>{children}</div>
);
const Row = ({children}) => <div style={{display:"flex", alignItems:"flex-start", gap:9, fontSize:13.5, color:"var(--ink)"}}>{children}</div>;

/* ---------- avatar ---------- */
const Avatar = ({t, size=46}) => (
  <div style={{width:size, height:size, borderRadius:"50%", flex:"0 0 auto",
    background:"linear-gradient(135deg,#0E7C66,#17A085)", color:"#fff",
    display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700, fontSize:size*0.34}}>{t}</div>
);

/* =======================================================
   FLUJO CLIENTE
======================================================= */
function Cliente({go, data, setData}){
  const [tipo, setTipo] = useState(data.tipo || null);

  switch(data.screen){
    case "describir": return (
      <Section>
        <H sub="Contanos qué necesitás. Te mostramos solo gente verificada cerca.">¿Qué changa tenés?</H>
        <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
          {TIPOS.map(t=>(
            <button key={t} onClick={()=>setTipo(t)} style={{
              border:"1.5px solid "+(tipo===t?"var(--green)":"var(--line)"),
              background:tipo===t?"var(--green-soft)":"var(--card)", color:tipo===t?"var(--green)":"var(--ink)",
              fontWeight:600, fontSize:13, padding:"9px 13px", borderRadius:99}}>{t}</button>
          ))}
        </div>
        <Card pad={0}>
          <div style={{padding:14, borderBottom:"1px solid var(--line)"}}>
            <label style={{fontSize:12.5, fontWeight:600, color:"var(--muted)"}}>Descripción</label>
            <div style={{marginTop:6, fontSize:13.5, color:"var(--ink)"}}>Armar un placar de 3 puertas, ya comprado y en caja.</div>
          </div>
          <div style={{display:"flex"}}>
            <div style={{flex:1, padding:14, borderRight:"1px solid var(--line)"}}>
              <label style={{fontSize:12.5, fontWeight:600, color:"var(--muted)"}}>Dónde</label>
              <div style={{marginTop:6, fontSize:13.5}}>Pocitos, Montevideo</div>
            </div>
            <div style={{flex:1, padding:14}}>
              <label style={{fontSize:12.5, fontWeight:600, color:"var(--muted)"}}>Cuándo</label>
              <div style={{marginTop:6, fontSize:13.5}}>Hoy, tarde</div>
            </div>
          </div>
        </Card>
        <div style={{display:"flex", gap:8, alignItems:"center", color:"var(--muted)", fontSize:12.5}}>
          <div style={{width:54, height:54, borderRadius:10, border:"1.5px dashed var(--line)", display:"flex",
            alignItems:"center", justifyContent:"center", flex:"0 0 auto", fontSize:20}}>＋</div>
          <span>Sumá una foto para que te coticen mejor (opcional)</span>
        </div>
        <Btn onClick={()=>go("candidatos")}>Ver prestadores disponibles</Btn>
      </Section>
    );

    case "candidatos": return (
      <Section>
        <H sub="Todos con identidad verificada. Precio y reputación a la vista.">3 personas pueden ayudarte</H>
        {PRESTADORES.map(p=>(
          <Card key={p.id} onClick={()=>{setData(d=>({...d, sel:p})); go("perfil");}}>
            <div style={{display:"flex", gap:12}}>
              <Avatar t={p.avatar}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:"flex", justifyContent:"space-between", gap:8, alignItems:"baseline"}}>
                  <strong style={{fontSize:15}}>{p.nombre}</strong>
                  <span style={{fontWeight:700, color:"var(--amber)", fontSize:14, whiteSpace:"nowrap"}}>{p.precio}</span>
                </div>
                <div style={{fontSize:13, color:"var(--muted)", margin:"1px 0 7px"}}>{p.titulo}</div>
                <div style={{display:"flex", gap:7, flexWrap:"wrap"}}>
                  <Badge tone="amber"><Star/> {p.rating} · {p.resenas} reseñas</Badge>
                  <Badge><Shield/> Verificado</Badge>
                </div>
              </div>
            </div>
          </Card>
        ))}
        <p style={{textAlign:"center", color:"var(--muted)", fontSize:12.5, margin:0}}>Tocá a alguien para ver su perfil</p>
      </Section>
    );

    case "perfil": {
      const p = data.sel;
      return (
        <Section>
          <div style={{display:"flex", gap:13, alignItems:"center"}}>
            <Avatar t={p.avatar} size={58}/>
            <div>
              <h2 style={{fontFamily:"var(--font-display)", fontWeight:600, fontSize:22, margin:0}}>{p.nombre}</h2>
              <div style={{fontSize:13, color:"var(--muted)"}}>En Vecino desde {p.desde} · {p.zona}</div>
            </div>
          </div>
          <div style={{display:"flex", gap:7, flexWrap:"wrap"}}>
            <Badge tone="amber"><Star/> {p.rating}</Badge>
            <Badge tone="gray">{p.trabajos} trabajos</Badge>
            {p.insignias.map(i=><Badge key={i}><Shield/> {i}</Badge>)}
          </div>
          <Card>
            <strong style={{fontSize:13.5}}>Qué incluye este servicio</strong>
            <div style={{display:"flex", flexDirection:"column", gap:8, marginTop:10}}>
              {p.incluye.map(i=><Row key={i}><Check/><span>{i}</span></Row>)}
            </div>
          </Card>
          <Card>
            <strong style={{fontSize:13.5}}>Reseñas recientes</strong>
            <div style={{marginTop:9, fontSize:13, color:"var(--ink)"}}>
              <div style={{marginBottom:8}}><Star/><Star/><Star/><Star/><Star/> <em>“Puntual y prolijo, dejó todo armado y limpio.”</em> — Ana, hace 3 días</div>
              <div><Star/><Star/><Star/><Star/><Star/> <em>“Re recomendable, trajo todas las herramientas.”</em> — Flor, hace 1 semana</div>
            </div>
          </Card>
          <Btn onClick={()=>go("acordar")}>Acordar precio y alcance</Btn>
        </Section>
      );
    }

    case "acordar": {
      const p = data.sel;
      return (
        <Section>
          <H sub="Dejá claro qué se hace y cuánto, antes de confirmar.">Acuerdo con {p.nombre}</H>
          <Card>
            <strong style={{fontSize:13.5}}>La changa</strong>
            <div style={{display:"flex", flexDirection:"column", gap:8, marginTop:10}}>
              <Row><Check/><span>Armar un placar de 3 puertas (ya comprado, en caja)</span></Row>
              <Row><Check/><span>Pocitos · hoy a partir de las 16:00</span></Row>
              <Row><Check/><span>Incluye herramientas y retirar el embalaje</span></Row>
            </div>
          </Card>
          <Card>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <span style={{fontSize:13.5, color:"var(--muted)"}}>Precio acordado</span>
              <span style={{fontFamily:"var(--font-display)", fontWeight:600, fontSize:24, color:"var(--amber)"}}>$ 1.400</span>
            </div>
            <div style={{fontSize:12, color:"var(--muted)", marginTop:4}}>Cerrado. Sin sorpresas al final: si aparece algo extra, se acuerda antes.</div>
          </Card>
          <Btn variant="amber" onClick={()=>go("pago")}>Confirmar y pagar</Btn>
          <button onClick={()=>go("candidatos")} style={{background:"none", border:"none", color:"var(--muted)", fontSize:13, fontWeight:600}}>Elegir otra persona</button>
        </Section>
      );
    }

    case "pago": return (
      <Section>
        <H>Pago protegido</H>
        <Card>
          <div style={{display:"flex", gap:11, alignItems:"flex-start"}}>
            <Shield s={30} c="var(--amber)"/>
            <div style={{fontSize:13.5, lineHeight:1.5}}>
              Pagás ahora, pero <strong>tu dinero queda retenido por Vecino</strong>. Recién se le libera al prestador <strong>cuando vos confirmás</strong> que el trabajo quedó bien.
            </div>
          </div>
        </Card>
        <Card>
          <div style={{display:"flex", justifyContent:"space-between", fontSize:13.5, marginBottom:7}}><span>Trabajo</span><span>$ 1.400</span></div>
          <div style={{display:"flex", justifyContent:"space-between", fontSize:13.5, color:"var(--muted)", marginBottom:7}}><span>Comisión Vecino</span><span>$ 140</span></div>
          <div style={{borderTop:"1px solid var(--line)", paddingTop:9, display:"flex", justifyContent:"space-between", fontWeight:700, fontSize:15}}><span>Total retenido</span><span style={{color:"var(--amber)"}}>$ 1.540</span></div>
        </Card>
        <Btn variant="amber" onClick={()=>go("seguimiento")} sub="El dinero no se libera hasta tu confirmación">Pagar $ 1.540 · queda en garantía</Btn>
      </Section>
    );

    case "seguimiento": {
      const [done, setDone] = useState(false);
      const pasos = [
        {t:"Pago retenido", d:"$ 1.540 en garantía", ok:true},
        {t:"Mariana confirmó", d:"Llega hoy 16:00", ok:true},
        {t:"Trabajo en curso", d:"Armando el placar", ok:true},
        {t:"Confirmás y se libera el pago", d:done?"¡Listo! Pago liberado a Mariana":"Pendiente de tu OK", ok:done},
      ];
      return (
        <Section>
          <H sub="Seguí la changa en vivo. Vos tenés el último control.">Changa en marcha</H>
          <Card>
            {pasos.map((s,i)=>(
              <div key={i} style={{display:"flex", gap:11, paddingBottom:i<3?14:0}}>
                <div style={{display:"flex", flexDirection:"column", alignItems:"center"}}>
                  <div style={{width:18, height:18, borderRadius:"50%", background:s.ok?"var(--green)":"var(--line)",
                    display:"flex", alignItems:"center", justifyContent:"center"}}>
                    {s.ok && <svg width="11" height="11" viewBox="0 0 24 24"><path d="M6 12.5l3.5 3.5 8-9" stroke="#fff" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  {i<3 && <div style={{width:2, flex:1, background:s.ok?"var(--green)":"var(--line)", minHeight:24}}/>}
                </div>
                <div style={{marginTop:-2}}>
                  <div style={{fontWeight:600, fontSize:14}}>{s.t}</div>
                  <div style={{fontSize:12.5, color:"var(--muted)"}}>{s.d}</div>
                </div>
              </div>
            ))}
          </Card>
          {!done
            ? <Btn variant="amber" onClick={()=>setDone(true)}>Confirmar trabajo terminado → liberar pago</Btn>
            : <>
                <Card><div style={{textAlign:"center", fontSize:14}}>Se liberaron <strong>$ 1.400</strong> a Mariana. ¡Dejale una reseña!</div></Card>
                <Btn variant="ghost" onClick={()=>go("describir")}>Volver al inicio</Btn>
              </>}
        </Section>
      );
    }
    default: return null;
  }
}

/* =======================================================
   FLUJO PRESTADOR
======================================================= */
function Prestador({go, data, setData}){
  switch(data.screen){
    case "disponibles": return (
      <Section>
        <H sub="Cada changa ya tiene el pago asegurado y la tarea definida.">Changas cerca tuyo</H>
        {CHANGAS_PRESTADOR.map(c=>(
          <Card key={c.id} onClick={()=>{setData(d=>({...d, selc:c})); go("detalle");}}>
            <div style={{display:"flex", justifyContent:"space-between", gap:8}}>
              <strong style={{fontSize:15}}>{c.titulo}</strong>
              <span style={{fontWeight:700, color:"var(--amber)", whiteSpace:"nowrap"}}>{c.monto}</span>
            </div>
            <div style={{fontSize:12.5, color:"var(--muted)", margin:"3px 0 9px"}}>{c.zona} · {c.cuando}</div>
            <Badge tone="amber"><Shield c="var(--amber)"/> Pago asegurado</Badge>
          </Card>
        ))}
      </Section>
    );
    case "detalle": {
      const c = data.selc;
      const [ok,setOk]=useState(false);
      return (
        <Section>
          <H sub={c.zona+" · "+c.cuando}>{c.titulo}</H>
          <Card>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <span style={{fontSize:13.5, color:"var(--muted)"}}>Vas a cobrar</span>
              <span style={{fontFamily:"var(--font-display)", fontWeight:600, fontSize:24, color:"var(--amber)"}}>{c.monto}</span>
            </div>
            <div style={{marginTop:8}}><Badge tone="amber"><Shield c="var(--amber)"/> El cliente ya pagó. El dinero está retenido y es tuyo al terminar.</Badge></div>
          </Card>
          <Card>
            <strong style={{fontSize:13.5}}>Alcance definido</strong>
            <div style={{display:"flex", flexDirection:"column", gap:8, marginTop:10}}>
              {c.alcance.map(a=><Row key={a}><Check/><span>{a}</span></Row>)}
            </div>
          </Card>
          {!ok
            ? <Btn onClick={()=>setOk(true)}>Aceptar changa</Btn>
            : <>
                <Card><div style={{textAlign:"center", fontSize:14}}>✅ Aceptaste. El cliente ya recibió tu confirmación. Al terminar y confirmar, cobrás <strong>{c.monto}</strong>.</div></Card>
                <Btn variant="ghost" onClick={()=>go("disponibles")}>Ver más changas</Btn>
              </>}
        </Section>
      );
    }
    default: return null;
  }
}

/* =======================================================
   SHELL / FRAME
======================================================= */
function App(){
  const [rol, setRol] = useState("cliente");
  const [data, setData] = useState({screen:"describir"});

  const histRef = React.useRef({cliente:["describir"], prestador:["disponibles"]});
  const go = (screen)=>{ histRef.current[rol].push(screen); setData(d=>({...d, screen})); };
  const back = ()=>{
    const h = histRef.current[rol];
    if(h.length>1){ h.pop(); setData(d=>({...d, screen:h[h.length-1]})); }
  };
  const switchRol = (r)=>{
    setRol(r);
    setData({screen: r==="cliente"?"describir":"disponibles"});
    histRef.current = {cliente:["describir"], prestador:["disponibles"]};
  };
  const canBack = histRef.current[rol].length>1;

  const titulo = rol==="cliente" ? "Necesito una changa" : "Quiero trabajar";

  return (
    <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14}}>
      {/* switch de rol */}
      <div style={{display:"flex", background:"#fff", border:"1px solid var(--line)", borderRadius:99, padding:4, boxShadow:"var(--shadow)"}}>
        {[["cliente","Soy cliente"],["prestador","Soy prestador"]].map(([k,l])=>(
          <button key={k} onClick={()=>switchRol(k)} style={{border:"none", borderRadius:99, padding:"8px 16px",
            fontSize:13, fontWeight:700, background: rol===k?"var(--green)":"transparent", color: rol===k?"#fff":"var(--muted)"}}>{l}</button>
        ))}
      </div>

      {/* frame del teléfono */}
      <div style={{width:390, maxWidth:"94vw", background:"var(--paper)", borderRadius:34,
        border:"10px solid #1b241f", boxShadow:"0 24px 60px rgba(22,32,28,.28)", overflow:"hidden", position:"relative"}}>
        {/* header app */}
        <div style={{background:"var(--card)", borderBottom:"1px solid var(--line)", padding:"13px 16px 12px",
          display:"flex", alignItems:"center", gap:10}}>
          {canBack
            ? <button onClick={back} style={{border:"none", background:"none", fontSize:22, lineHeight:1, color:"var(--ink)", padding:0, width:24}}>‹</button>
            : <div style={{width:24, height:24, borderRadius:7, background:"var(--green)", color:"#fff",
                display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:15, fontFamily:"var(--font-display)"}}>V</div>}
          <div style={{flex:1}}>
            <div style={{fontFamily:"var(--font-display)", fontWeight:600, fontSize:16, lineHeight:1}}>Vecino</div>
            <div style={{fontSize:11, color:"var(--muted)"}}>{titulo}</div>
          </div>
          <Badge tone="gray">Prototipo</Badge>
        </div>

        {/* cuerpo */}
        <div style={{padding:16, minHeight:470, maxHeight:"72vh", overflowY:"auto"}}>
          {rol==="cliente"
            ? <Cliente go={go} data={data} setData={setData}/>
            : <Prestador go={go} data={data} setData={setData}/>}
        </div>
      </div>

      <p style={{fontSize:12, color:"var(--muted)", maxWidth:390, textAlign:"center", margin:0, lineHeight:1.5}}>
        Prototipo navegable · Vecino — changas de confianza. Tocá los botones para recorrer el flujo. Cambiá entre <strong>cliente</strong> y <strong>prestador</strong> arriba.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
